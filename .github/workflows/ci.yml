name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pinned toolchain and runs `lake build`, which runs the #guard tests.
      # No build cache: `include_str` files (the committed generated files, the Haskell fixtures) are not
      # tracked by Lake, so a cached module could keep the text of an older copy (seen on #60).
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false

      # Lean's kernel checks the exported theorems when the library is built; check that none depends
      # on an axiom or `sorry`, and that Lean rejects wrong theorems.
      - name: Exported proofs
        run: |
          sh scripts/check-axioms.sh
          sh scripts/check-negative-export.sh

      # The compile gate: every generated proofs file is regenerated on the clean runner, must equal the
      # committed copy, and every theorem in it must compile (found N, compiled N).
      - name: Compile gate
        run: |
          lake build export-lean
          for m in proofs suite trees; do
            case $m in proofs) f=AppendixBProofs;; suite) f=Suite;; trees) f=Trees;; esac
            lake exe export-lean $m > /tmp/$f.lean 2> /dev/null
            diff -u MathematicalMethodology/Generated/$f.lean /tmp/$f.lean
            python3 scripts/gate-compile.py /tmp/$f.lean
          done

      # The trace executable (first search only: seconds). It exits non-zero if the kept functions
      # are not the three of Appendix B; the output is not committed.
      - name: Traces (first search)
        run: |
          lake build trace
          lake exe trace "$RUNNER_TEMP/trace" first

      # Compare large dumps of the strategic level with hashes of the original Haskell's output.
      - name: Compare with the Haskell
        run: lake exe haskell-check

      # Regenerate the report (and the data the website is built from) on a clean runner. The executable exits non-zero if a good
      # certificate is rejected or a bad one is accepted.
      - name: Generate results
        shell: bash
        run: |
          mkdir -p results
          lake exe results | tee results/report.md
          lake exe site-data > results/site-data.json

      # results/report.md is deterministic, so a diff means it is stale.
      - name: Check committed results are up to date
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- results/)" ]; then
            git --no-pager diff -- results/ || true
            echo "::error::results/ is stale. Run 'lake exe results > results/report.md' and 'lake exe site-data > results/site-data.json' and commit them."
            exit 1
          fi

      # The website is generated from the repository's own artifacts (site/build.mjs). Building it checks
      # that they agree: every Lean symbol it quotes exists, every lemma has its Lean theorem and every
      # theorem its lemma, and the report's numbers equal the data's. Nothing is deployed from here.
      - name: Build the website
        run: SITE_OFFLINE=1 node site/build.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/
